services:

  # ─── Infrastructure ────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: agentic-redis
    restart: unless-stopped
    # AOF activé : chaque opération Redis est écrite sur disque → zéro perte
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Git Bridge ────────────────────────────────────────────────────────────
  # Seul service autorisé à faire des opérations git.
  # Monte le monorepo complet en lecture+écriture.
  # Écoute git:commits et git:tags depuis les agents.

  git-bridge:
    build: ./services/git-bridge
    container_name: agentic-git-bridge
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL:          redis://redis:6379
      GIT_ROOT:           /workspace
      # Identité git — source unique : .env
      GIT_AUTHOR_NAME:    ${GIT_AUTHOR_NAME}
      GIT_AUTHOR_EMAIL:   ${GIT_AUTHOR_EMAIL}
    volumes:
      - ./:/workspace   # monorepo complet — seul service rw sur le .git

  # ─── Services plateforme ───────────────────────────────────────────────────

  graph-registry:
    build: ./services/graph-registry
    container_name: agentic-graph-registry
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379

  context-manager:
    build: ./services/context-manager
    container_name: agentic-context-manager
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL:      redis://redis:6379
      WORKSPACE_PATH: /realness
    volumes:
      - ./realness:/realness:ro   # observe le workspace du framework C

  # ─── Phase Controller (agent-app) ─────────────────────────────────────────
  # Monte le monorepo complet pour lire/écrire les specs (realness/specs/)
  # et disposer du contexte git (GIT_ROOT=/workspace).

  agent-app:
    build: ./agents/agent-app
    container_name: agentic-agent-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      graph-registry:
        condition: service_started
      git-bridge:
        condition: service_started
    environment:
      REDIS_URL:          redis://redis:6379
      WORKSPACE_PATH:     /workspace/realness
      GIT_ROOT:           /workspace
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    volumes:
      - ./:/workspace    # rw pour écrire specs — git géré par git-bridge
    stdin_open: true
    tty: true

  # ─── Agents Architecture Fonctionnelle ─────────────────────────────────────
  # access: none → aucun volume workspace

  af:
    build: ./agents/AF
    container_name: agentic-AF
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL:          redis://redis:6379
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

  af-p2p:
    build: ./agents/AF_P2P
    container_name: agentic-AF-P2P
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL:          redis://redis:6379
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

  # ─── Agents Architecture Technique ─────────────────────────────────────────

  # AT : read_headers → seul le dossier realness/ monté, pas de git requis
  at:
    build: ./agents/AT
    container_name: agentic-AT
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL:          redis://redis:6379
      WORKSPACE_PATH:     /realness
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    volumes:
      - ./realness:/realness:ro   # lecture .h via Path.rglob (pas de git)

  # AT_SEC / AT_COMP : read_all → monorepo complet en lecture seule pour git log/diff
  at-sec:
    build: ./agents/AT_SEC
    container_name: agentic-AT-SEC
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL:          redis://redis:6379
      WORKSPACE_PATH:     /workspace/realness
      GIT_ROOT:           /workspace
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    volumes:
      - ./:/workspace:ro   # git ls-files, log, diff scopés à realness/

  at-comp:
    build: ./agents/AT_COMP
    container_name: agentic-AT-COMP
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL:          redis://redis:6379
      WORKSPACE_PATH:     /workspace/realness
      GIT_ROOT:           /workspace
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    volumes:
      - ./:/workspace:ro   # git ls-files, log, diff scopés à realness/

  # ─── Agent Développeur ─────────────────────────────────────────────────────
  # read_write → monorepo complet en rw (écriture fichiers C + contexte git)
  # IMPORTANT : D ne fait jamais git directement → délégation à git-bridge

  d:
    build: ./agents/D
    container_name: agentic-D
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      git-bridge:
        condition: service_started
    environment:
      REDIS_URL:          redis://redis:6379
      WORKSPACE_PATH:     /workspace/realness
      GIT_ROOT:           /workspace
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    volumes:
      - ./:/workspace   # rw — git délégué à git-bridge

  # ─── Agent Testeur ─────────────────────────────────────────────────────────
  # read_write → monorepo ro suffit (compilation dans /tmp, pas d'écriture repo)

  t:
    build: ./agents/T
    container_name: agentic-T
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL:          redis://redis:6379
      WORKSPACE_PATH:     /workspace/realness
      GIT_ROOT:           /workspace
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    volumes:
      - ./:/workspace:ro   # lecture seule — binaires compilés dans /tmp